spring.application.name=jwt-nimbus-demo
server.port=8005

# H2 allows the lecture example to run without a local MySQL server.
spring.datasource.url=jdbc:h2:mem:jwt_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Read a Base64-encoded secret from the environment. It must decode to at least 32 bytes for HS256.
security.jwt.secret-key=${JWT_SECRET_KEY:}
security.jwt.expiration-time=3600000
security.jwt.issuer=jwt-nimbus-demo
security.jwt.audience=jwt-nimbus-client
